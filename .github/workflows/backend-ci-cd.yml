name: Backend CI/CD

on:
  pull_request:
    branches: [develop]
    paths:
      - 'apps/api/**'
      - 'infra/db/migrations/**'
      - 'infra/deploy/**'
      - '.github/workflows/backend-ci-cd.yml'
  push:
    branches: [develop]
    paths:
      - 'apps/api/**'
      - 'infra/db/migrations/**'
      - 'infra/deploy/**'
      - '.github/workflows/backend-ci-cd.yml'

permissions:
  contents: read

concurrency:
  group: backend-ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Build and verify
        working-directory: apps/api
        run: ./mvnw -B verify
      - name: Package release
        if: github.event_name == 'push' && vars.BACKEND_DEPLOY_ROLE_ARN != ''
        run: |
          mkdir -p release/migrations
          install -m 0644 apps/api/target/tabula-ignium-api-*.jar release/api.jar
          install -m 0644 infra/db/migrations/*.sql release/migrations/
          install -m 0644 infra/deploy/sanbul24-api.service release/
          install -m 0644 infra/deploy/deploy-backend.sh release/
          tar -czf backend-release.tar.gz -C release .
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && vars.BACKEND_DEPLOY_ROLE_ARN != ''
        with:
          name: backend-release
          path: backend-release.tar.gz
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: build
    if: github.event_name == 'push' && vars.BACKEND_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      id-token: write
    env:
      AWS_REGION: ${{ vars.BACKEND_AWS_REGION }}
      DEPLOY_BUCKET: ${{ vars.BACKEND_DEPLOY_BUCKET }}
      INSTANCE_ID: ${{ vars.BACKEND_EC2_INSTANCE_ID }}
    steps:
      - name: Check AWS configuration
        shell: bash
        run: |
          : "${AWS_REGION:?Set BACKEND_AWS_REGION}"
          : "${DEPLOY_BUCKET:?Set BACKEND_DEPLOY_BUCKET}"
          : "${INSTANCE_ID:?Set BACKEND_EC2_INSTANCE_ID}"
      - uses: actions/download-artifact@v5
        with:
          name: backend-release
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload release to S3
        shell: bash
        run: |
          aws s3 cp backend-release.tar.gz "s3://$DEPLOY_BUCKET/backend/$GITHUB_SHA/release.tar.gz" --only-show-errors
      - name: Deploy and check the API
        shell: bash
        run: |
          release_uri="s3://$DEPLOY_BUCKET/backend/$GITHUB_SHA/release.tar.gz"
          parameters="$(
            jq -n --arg uri "$release_uri" --arg region "$AWS_REGION" --arg revision "$GITHUB_SHA" '
              {
                executionTimeout: ["480"],
                commands: [
                  "set -eu",
                  "work_dir=$(mktemp -d)",
                  "trap \u0027rm -rf -- \"$work_dir\"\u0027 EXIT",
                  "aws s3 cp --only-show-errors \($uri | @sh) \"$work_dir/release.tar.gz\" --region \($region | @sh)",
                  "tar -xzf \"$work_dir/release.tar.gz\" -C \"$work_dir\"",
                  "bash \"$work_dir/deploy-backend.sh\" \($revision | @sh)"
                ]
              }
            '
          )"
          command_id="$(
            aws ssm send-command --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript --parameters "$parameters" \
              --timeout-seconds 120 --query Command.CommandId --output text
          )"
          echo "SSM command: $command_id"

          for ((attempt = 0; attempt < 120; attempt++)); do
            if ! status="$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>&1)"; then
              if [[ "$status" != *InvocationDoesNotExist* ]]; then
                printf '%s\n' "$status" >&2
                exit 1
              fi
              status=Pending
            fi

            case "$status" in
              Success) exit 0 ;;
              Pending|InProgress|Delayed|Cancelling) sleep 5 ;;
              *)
                aws ssm get-command-invocation --command-id "$command_id" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{status:StatusDetails,output:StandardOutputContent,error:StandardErrorContent}'
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for SSM command $command_id" >&2
          exit 1
