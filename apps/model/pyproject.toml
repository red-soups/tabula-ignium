[project]
name = "fsml"
version = "0.1.0"
description = "Tabula Ignium MODIS ↔ VIIRS hotspot harmonization model"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "matplotlib>=3.9",
  "jupyterlab>=4.2",
  "ipykernel>=6.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]                    # .venv/bin/pip install -e ".[dev]" → .venv/bin/python -m pytest tests
landcover = ["pyhdf>=0.11", "rasterio>=1.3"]  # MCD12C1 읽기: .hdf는 pyhdf, AppEEARS .tif는 rasterio

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fsml"]
